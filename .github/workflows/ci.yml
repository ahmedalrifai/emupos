name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest

  contracts:
    # Checks that only need one OS: the generated CLI reference and the /api/v1 contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: docs/cli.md matches the CLI
        run: |
          uv run typer emupos.cli.app utils docs --name emupos --title "emupos command reference" --output "$RUNNER_TEMP/cli.md"
          diff -u docs/cli.md "$RUNNER_TEMP/cli.md" || { echo "::error::docs/cli.md is out of date; see CONTRIBUTING.md"; exit 1; }
      - name: /api/v1 stays compatible
        run: uv run python scripts/check_api_compat.py

  licences:
    # Runtime dependencies must be permissively licensed (Apache-2.0 compatible). OS-specific
    # dependencies only install on their OS, so check every OS.
    name: licences (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt
      - run: >
          uvx --python 3.13 --with-requirements runtime-requirements.txt
          pip-licenses --from=mixed --partial-match --fail-on="GPL"
          --ignore-packages pip-licenses prettytable wcwidth tomli
