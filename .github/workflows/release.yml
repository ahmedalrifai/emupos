name: Release

# One workflow publishes a release, because PyPI Trusted Publishing trusts this file by name.
#
#   push to main  → release-please keeps a release PR up to date
#   merge that PR → release-please tags vX.Y.Z and drafts the GitHub Release
#   then          → build → smoke test the wheel on 3 OSes → PyPI → publish the GitHub Release
#
# Pushing a vX.Y.Z tag by hand runs the same build → smoke → publish path.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Tag matches the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
          sparse-checkout: .github/scripts
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the built wheel into a clean environment
        run: uv venv smoke-env && uv pip install --python smoke-env dist/*.whl
      - name: Smoke test
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then python=smoke-env/Scripts/python.exe; else python=smoke-env/bin/python; fi
          "$python" .github/scripts/smoke_test.py "${TAG#v}"

  publish-pypi:
    needs: [build, smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing; no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2 # publishes attestations by default

  publish-image:
    needs: [build, publish-pypi]
    if: ${{ always() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets of the dockerhub environment (docs/docker.md); the image was not pushed"
            exit 1
          fi
      - name: Which image and tags
        id: image
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/emupos', secrets.DOCKERHUB_USERNAME) }}
        run: |
          version="${TAG#v}"
          # Braces, so the same snippet is safe to try in a zsh shell, where `$IMAGE:latest`
          # would parse as the `${IMAGE:l}` lowercase modifier followed by `atest`.
          tags="${IMAGE}:${version}"
          # A prerelease (1.0.0-rc.1) is published, but `latest` keeps pointing at the last stable one.
          case "$version" in
            *-*) ;;
            *) tags="${tags},${IMAGE}:latest" ;;
          esac
          {
            echo "image=$IMAGE"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
      - name: Build for this runner and smoke test the image from outside the container
        run: |
          docker build -t emupos:candidate .
          python3 .github/scripts/image_smoke_test.py emupos:candidate
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: This version was not published before
        env:
          REFERENCE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}
        run: |
          if docker manifest inspect "$REFERENCE" > /dev/null 2>&1; then
            echo "::error::$REFERENCE already exists; a published version is never overwritten, so release a patch version instead"
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}

  github-release:
    needs: [build, publish-pypi]
    if: ${{ always() && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish the GitHub Release with the changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 .github/scripts/changelog_section.py "${TAG#v}" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
