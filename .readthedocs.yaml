# Read the Docs builds this site on every push to main, every release tag and every pull
# request. `--strict` fails the build on a broken internal link.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    build:
      html:
        - zensical build --strict
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -r site/. "$READTHEDOCS_OUTPUT/html/"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
