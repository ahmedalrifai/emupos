[project]
name = "emupos"
version = "0.0.0"
description = "Simulate POS hardware (receipt printers, cash drawers, scales, barcode scanners) at the wire-protocol level."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "emupos contributors" }]
keywords = ["pos", "point-of-sale", "simulator", "escpos", "receipt-printer", "scale", "barcode-scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# Every runtime dependency is justified in CONTRIBUTING.md ("Dependency budget").
dependencies = [
    "fastapi>=0.141",
    "pillow>=12.3",
    "pydantic>=2.13",
    "python-barcode>=0.16",
    "pyyaml>=6.0.3",
    "segno>=1.6",
    "typer>=0.27",
    "uvicorn>=0.52",
    "pyobjc-framework-Quartz>=12.2; sys_platform == 'darwin'",
    "serialx>=1.10; sys_platform == 'win32'",
    "websockets>=17.1",
]

[project.scripts]
emupos = "emupos.cli.app:main"

[project.urls]
Homepage = "https://github.com/emupos/emupos"
Issues = "https://github.com/emupos/emupos/issues"
Changelog = "https://github.com/emupos/emupos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.168",
    "jsonschema>=4.26",
    "pip-licenses>=5.5",
    "pyright>=1.1.414",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "syrupy>=6.0",
    "types-pyyaml>=6.0.12",
    "zxing-cpp>=3.1",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emupos"]
exclude = ["**/test_*.py", "**/conftest.py", "**/cases/**", "**/dialogues/**", "**/__snapshots__/**"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/.claude", "/openspec", "/spikes", "/release-please-config.json", "/.release-please-manifest.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "TID", "N", "PT"]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Design D2: device and protocol code is pure. I/O lives only in transports/, api/ and daemon.py.
"asyncio".msg = "I/O belongs in transports/, api/ or daemon.py (design D2)"
"socket".msg = "I/O belongs in transports/, api/ or daemon.py (design D2)"
"ctypes".msg = "OS calls belong in transports/ (design D2)"
"termios".msg = "Serial handling belongs in transports/ (design D2)"
"serial".msg = "Serial handling belongs in transports/ (design D2)"
"serialx".msg = "Serial handling belongs in transports/ (design D2)"

[tool.ruff.lint.per-file-ignores]
"src/emupos/transports/**" = ["TID251"]
"src/emupos/api/**" = ["TID251"]
"src/emupos/daemon.py" = ["TID251"]
"**/test_*.py" = ["S101"] # assert is how pytest tests work
".github/scripts/**" = ["TID251", "S101", "S310", "S603"] # release tooling: fixed commands against localhost

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["src", "scripts"]
pythonpath = ["scripts"]
python_files = ["test_*.py"]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
