<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emupos keyboard-wedge keylogger</title>
<!--
  Keyboard-wedge spike (task 1.2). Open this file directly in the browser (no server).
  Click the field, run a type_*.py script or scan with a real scanner, then
  "Copy log as JSON" and paste the result into docs/spikes/keyboard-wedge.md.
  Logs every keydown/keyup: key, code, keyCode, shiftKey, repeat, isComposing,
  time since page load (ms) and time since the previous event (ms).
-->
<style>
  :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
  body { margin: 0; padding: 16px; }
  input { font: 20px ui-monospace, monospace; width: 100%; max-width: 40rem; padding: 6px; box-sizing: border-box; }
  button { margin: 8px 8px 8px 0; }
  #assembled { font: 18px ui-monospace, monospace; }
  table { border-collapse: collapse; font: 13px ui-monospace, monospace; }
  th, td { border-bottom: 1px solid #8884; padding: 2px 10px 2px 0; text-align: left; white-space: nowrap; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Keyboard-wedge keylogger</h1>
<p><input id="field" autofocus autocomplete="off" placeholder="focus here, then type or scan"></p>
<p>Assembled from keydown <code>key</code>: <span id="assembled"></span></p>
<p>
  <button id="copy" tabindex="-1">Copy log as JSON</button>
  <button id="clear" tabindex="-1">Clear</button>
  <span id="status"></span>
</p>
<textarea id="fallback" rows="6" cols="80" hidden></textarea>
<div class="wrap">
  <table>
    <thead><tr><th>#</th><th>type</th><th>key</th><th>code</th><th>keyCode</th><th>shift</th><th>repeat</th><th>composing</th><th>t ms</th><th>&Delta; ms</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
  const field = document.getElementById("field");
  const rows = document.getElementById("rows");
  const assembledEl = document.getElementById("assembled");
  const statusEl = document.getElementById("status");
  let events = [];
  let assembled = "";

  function record(event) {
    const t = Math.round(performance.now() * 10) / 10;
    const previous = events.at(-1);
    const entry = {
      type: event.type,
      key: event.key,
      code: event.code,
      keyCode: event.keyCode,
      shiftKey: event.shiftKey,
      repeat: event.repeat,
      isComposing: event.isComposing,
      t,
      dt: previous ? Math.round((t - previous.t) * 10) / 10 : 0,
    };
    events.push(entry);
    if (event.type === "keydown") {
      if ([...event.key].length === 1) assembled += event.key; // one character, even outside the BMP
      else if (event.key === "Enter") assembled += "⏎";
      else if (event.key === "Tab") assembled += "⇥";
      assembledEl.textContent = assembled;
    }
    const row = rows.insertRow();
    for (const value of [events.length, entry.type, JSON.stringify(entry.key), entry.code || "(empty)",
                         entry.keyCode, entry.shiftKey, entry.repeat, entry.isComposing, entry.t, entry.dt]) {
      row.insertCell().textContent = value;
    }
  }

  document.addEventListener("keydown", record, true);
  document.addEventListener("keyup", record, true);
  field.addEventListener("keydown", (event) => {
    if (event.key === "Tab") event.preventDefault(); // keep focus in the field
  });

  function logJson() {
    return JSON.stringify({
      userAgent: navigator.userAgent,
      loggedAt: new Date().toISOString(),
      assembled,
      fieldValue: field.value,
      events,
    }, null, 2);
  }

  document.getElementById("copy").addEventListener("click", async () => {
    const text = logJson();
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = `copied ${events.length} events`;
      field.focus();
    } catch {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.value = text;
      fallback.select();
      statusEl.textContent = "clipboard blocked: copy the selected text below";
    }
  });

  document.getElementById("clear").addEventListener("click", () => {
    events = [];
    assembled = "";
    field.value = "";
    rows.textContent = "";
    assembledEl.textContent = "";
    statusEl.textContent = "";
    field.focus();
  });
</script>
</body>
</html>
